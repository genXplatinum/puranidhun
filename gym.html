<!doctype html>
<html lang="en" data-gym>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loha — Gym Playlist | Purani Dhun</title>
<meta name="description" content="Punjabi gym playlist. Sidhu Moose Wala, Karan Aujla, Ninja, Varinder Brar — heavy Punjabi records in an iron corridor that moves with the beat.">
<meta name="theme-color" content="#08090b">
<link rel="canonical" href="https://puranidhun.in/gym.html">
<meta property="og:type" content="website">
<meta property="og:url" content="https://puranidhun.in/gym.html">
<meta property="og:site_name" content="Purani Dhun">
<meta property="og:title" content="LOHA — the gym playlist">
<meta property="og:description" content="The other nine rooms are for remembering. This one is for lifting. Heavy Punjabi records, in an iron corridor that moves with the beat.">
<meta property="og:image" content="https://puranidhun.in/assets/img/og-gym.png?v=4">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Loha, lit at the end of a dark corridor in hazard yellow">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="LOHA — the gym playlist">
<meta name="twitter:description" content="The other nine rooms are for remembering. This one is for lifting.">
<meta name="twitter:image" content="https://puranidhun.in/assets/img/og-gym.png?v=4">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Khand alone. The site used to set every wordmark twice, once in the
     record's own script and once in Latin under it; it now sets each one
     once, in Latin, and the second face is no longer needed. -->
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/loha.css">
</head>
<body>

<!-- the audio host: rendered, because browsers throttle a display:none
     iframe, but 1px and inert. No picture here either. -->
<div id="yt-host" aria-hidden="true"><div id="yt-player"></div></div>

<a class="skip" href="#deck">Skip to the player</a>

<!-- ══ the corridor ═════════════════════════════════════════════════
     A WebGL tunnel. If the context will not come up, the CSS behind it
     is a lit concrete floor and the page carries on without it. -->
<div id="room" aria-hidden="true"><canvas id="bg"></canvas></div>
<div id="vig" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>

<!-- The room shakes and the type shakes. The CONTROLS DO NOT: a key you
     have to chase around the screen is a broken key, and that goes double
     for anyone whose hands are not steady to begin with. -->
<div id="shell">

  <header id="top">
    <a class="back" href="/">&larr; <span>Purani Dhun</span></a>
    <p class="mark">
      <b class="mark__lat mark__lat--solo">Loha</b>
      <span class="mark__lat">Gym Playlist</span>
    </p>
    <p class="stat"><span id="n-now">--</span><i>/</i><span id="n-all">--</span></p>
  </header>

  <!-- Four decks. One page, one corridor, and the corridor is a different
       room in each: hazard yellow, tungsten, red on rust, and — for Dance
       — the same corridor with a lighting rig patched into it. -->
  <nav id="decks" aria-label="Playlists">
    <button class="deck-btn" type="button" data-deck="now" aria-pressed="true">
      <b>Now</b><span>2019 &rarr;</span>
    </button>
    <button class="deck-btn" type="button" data-deck="era" aria-pressed="false">
      <b>The Era</b><span>2005&ndash;18</span>
    </button>
    <button class="deck-btn" type="button" data-deck="badmashi" aria-pressed="false">
      <b>Badmashi</b><span>2000&ndash;16</span>
    </button>
    <button class="deck-btn" type="button" data-deck="dance" aria-pressed="false">
      <b>Dance</b><span>2000&ndash;26</span>
    </button>
  </nav>

  <main id="deck">
    <div id="type">
      <p class="cue" id="cue">Loaded</p>
      <h1 class="title" id="title">&nbsp;</h1>
      <p class="by" id="by">&nbsp;</p>
      <p class="tags"><span id="year"></span><span id="film"></span></p>
    </div>

    <!-- the bar: a lift, not a scrub. It loads with plates as the song runs -->
    <div class="bar">
      <span class="bar__t" id="t-now">0:00</span>
      <div class="bar__rail">
        <div class="bar__fill" id="fill"></div>
        <div class="bar__beat" id="beatbar"></div>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
      </div>
      <span class="bar__t" id="t-all">0:00</span>
    </div>

    <div class="keys">
      <button id="k-prev" class="key" type="button" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14L8 12zM7 5v14"/></svg>
      </button>
      <button id="k-play" class="key key--go" type="button" aria-label="Play" aria-pressed="false">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM14 5h3v14h-3z"/></svg>
      </button>
      <button id="k-next" class="key" type="button" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l10-7zM17 5v14"/></svg>
      </button>
    </div>
  </main>

  <footer id="bot">
    <div class="rack">
      <button id="k-shuffle" class="chip" type="button" aria-pressed="false">Shuffle</button>
      <button id="k-tap" class="chip" type="button" aria-label="Tap the tempo">
        Tap <b id="bpm">--</b>
      </button>
      <label class="slide">
        <span>Force</span>
        <input id="force" type="range" min="0" max="100" value="70" step="1" aria-label="Force — how hard the room reacts">
      </label>
      <label class="slide slide--vol">
        <span>Vol</span>
        <input id="vol" type="range" min="0" max="100" value="85" step="1" aria-label="Volume">
      </label>
      <button id="k-haptic" class="chip" type="button" aria-pressed="false">Haptics</button>
      <a id="src" class="chip" href="#" target="_blank" rel="noopener">Source</a>
      <a class="chip chip--go" href="max.html">Worldwide &rarr;</a>
      <button id="k-made" class="chip chip--made" type="button">Made by Lovelace</button>
      <button id="k-list" class="chip chip--n" type="button" aria-expanded="false" aria-controls="list">
        <b id="list-n">0</b> tracks
      </button>
    </div>
  </footer>
</div>

<!-- ══ the loading screen ═══════════════════════════════════════════
     It fills, then it lets you in. There used to be a button here, and
     the button had a reason: a browser will not start audio without a
     user gesture. So this keeps the gesture without demanding it — a
     tap or a keypress during the load skips ahead AND unlocks the
     audio, and if you just wait, you land on a cued player and press
     play yourself. Nothing here pretends the sound started when it did
     not. -->
<div id="boot" role="status" aria-label="Loading Loha">
  <div class="boot__in">
    <p class="boot__kick">Made with <span class="boot__love">love</span> by</p>
    <h2 class="boot__mark">Lovelace<span>Studio</span></h2>
    <div class="boot__bar" aria-hidden="true"><i></i></div>
    <p class="boot__fine"><span id="boot-n">0</span> Punjabi records &middot; four decks &middot; heavy or dancing</p>
  </div>
</div>

<!-- ══ the rack ═════════════════════════════════════════════════════ -->
<aside id="list" aria-label="Track list" hidden>
  <div class="list__bar">
    <input id="q" type="search" placeholder="Search a track or an artist…" aria-label="Search tracks" autocomplete="off">
    <button id="list-close" class="chip" type="button">Close</button>
  </div>
  <p class="list__count" id="list-count"></p>
  <ol class="list__rows" id="rows"></ol>
  <p class="list__none" id="none" hidden>Nothing under that name.</p>
</aside>

<script src="assets/js/gym-catalog.js"></script>
<script src="assets/js/deck-gym.js"></script>
<script src="assets/js/corridor.js"></script>
<script src="assets/js/made.js"></script>
<script src="assets/js/loha.js"></script>
</body>
</html>
