<!doctype html>
<html lang="en" data-room="saloon-classics">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purani Dhun — nine rooms of old records</title>
<meta name="description" content="369 old Hindi and Punjabi records in nine rooms, on a cassette transport that runs while the song does — lit in each room's own colours.">
<meta name="theme-color" content="#08090b">
<link rel="canonical" href="https://puranidhun.in/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://puranidhun.in/">
<meta property="og:site_name" content="Purani Dhun">
<meta property="og:title" content="Purani Dhun — nine rooms of old records">
<meta property="og:description" content="The barber&#39;s mirror, the bus window, the auto at the red light — and the same song playing in all three. 369 old records, in nine rooms.">
<meta property="og:image" content="https://puranidhun.in/assets/img/og.png?v=4">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Purani Dhun, lit at the end of a dark corridor">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Purani Dhun — nine rooms of old records">
<meta name="twitter:description" content="The barber&#39;s mirror, the bus window, the auto at the red light — and the same song playing in all three. 369 old records, in nine rooms.">
<meta name="twitter:image" content="https://puranidhun.in/assets/img/og.png?v=4">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Khand is the machine on both pages. Tiro Devanagari Hindi is the
     voice here, because these are Hindi records and Devanagari leads. -->
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&display=swap" rel="stylesheet">
<!-- loha.css is the system for both pages; dhun.css is this page's half -->
<link rel="stylesheet" href="assets/css/loha.css">
<link rel="stylesheet" href="assets/css/dhun.css">
</head>
<body>

<!-- audio host: rendered, because browsers throttle a display:none
     iframe, but 1px and inert. This is a listening room; no picture. -->
<div id="yt-host" aria-hidden="true"><div id="yt-player"></div></div>

<a class="skip" href="#deck">Skip to the player</a>

<!-- ══ the corridor ═════════════════════════════════════════════════
     The same WebGL tunnel the gym page runs, lit in whichever room's
     pigments the dial is pointing at. If the context will not come up,
     the CSS floor behind it stands in. -->
<div id="room" aria-hidden="true"><canvas id="bg"></canvas></div>
<div id="vig" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>

<!-- The room shakes and the type shakes. The controls do not. -->
<div id="shell">

  <header id="top">
    <a class="back" href="gym.html"><span>Gym Playlist</span> &rarr;</a>
    <p class="mark">
      <b class="mark__lat mark__lat--solo">Purani Dhun</b>
      <span class="mark__lat">Nine rooms</span>
    </p>
    <p class="stat"><span id="n-now">--</span><i>/</i><span id="n-all">--</span></p>
  </header>

  <main id="deck">
    <!-- the transport: two reels and the tape between them. The supply
         reel empties and the take-up reel fills as the song runs, and
         both turn at v/r — so the thin one spins faster. That is the
         progress indicator; there is no second one drawn on top. -->
    <div id="record">
      <svg id="reels" role="img" aria-label="Cassette reels for the current song"></svg>
    </div>

    <div id="type">
      <button class="now__room" id="k-rooms" type="button"
              aria-haspopup="dialog" aria-expanded="false" aria-controls="picker">
        <span id="now-room"></span>
        <svg class="now__caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
      </button>
      <h1 class="now__title" id="now-title">Press play</h1>
      <p class="tags"><span id="now-artist"></span><span id="now-film"></span><span id="now-year"></span></p>
    </div>

    <div class="bar">
      <span class="bar__t" id="t-now">0:00</span>
      <div class="bar__rail">
        <div class="bar__fill" id="fill"></div>
        <div class="bar__beat" id="beatbar"></div>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
      </div>
      <span class="bar__t" id="t-all">0:00</span>
    </div>

    <div class="keys">
      <button id="k-prev" class="key" type="button" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14L8 12zM7 5v14"/></svg>
      </button>
      <button id="k-play" class="key key--go" type="button" aria-label="Play" aria-pressed="false">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM14 5h3v14h-3z"/></svg>
      </button>
      <button id="k-next" class="key" type="button" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l10-7zM17 5v14"/></svg>
      </button>
    </div>
  </main>

  <footer id="bot">
    <div class="rack">
      <button id="k-shuffle" class="chip" type="button" aria-pressed="false">Shuffle</button>
      <button id="k-tap" class="chip" type="button" aria-label="Tap the tempo">
        Tap <b id="bpm">--</b>
      </button>
      <label class="slide">
        <span>Force</span>
        <input id="force" type="range" min="0" max="100" value="55" step="1" aria-label="Force — how hard the room reacts">
      </label>
      <label class="slide slide--vol">
        <span>Vol</span>
        <input id="vol" type="range" min="0" max="100" value="80" step="1" aria-label="Volume">
      </label>
      <a id="src" class="chip" href="#" target="_blank" rel="noopener">Source</a>
      <a class="chip chip--go" href="max.html">Worldwide &rarr;</a>
      <button id="k-made" class="chip chip--made" type="button">Made by Lovelace</button>
      <button id="k-list" class="chip chip--n" type="button" aria-expanded="false" aria-controls="list">
        <b id="list-n">0</b> tapes
      </button>
    </div>
  </footer>
</div>

<!-- ══ the loading screen ═══════════════════════════════════════════
     It fills, then it lets you in. There used to be a button here, and
     the button had a reason: a browser will not start audio without a
     user gesture. So this keeps the gesture without demanding it — a
     tap or a keypress during the load skips ahead AND unlocks the
     audio, and if you just wait, you land on a cued player and press
     play yourself. Nothing here pretends the sound started when it did
     not. -->
<div id="boot" role="status" aria-label="Loading Purani Dhun">
  <div class="boot__art" aria-hidden="true"><svg id="boot-reels"></svg></div>
  <div class="boot__in">
    <p class="boot__kick">Made with <span class="boot__love">love</span> by</p>
    <h2 class="boot__mark">Lovelace<span>Studio</span></h2>
    <div class="boot__bar" aria-hidden="true"><i></i></div>
    <p class="boot__fine"><span id="boot-n">369</span> records &middot; nine rooms &middot; one long tape</p>
  </div>
</div>

<!-- ══ the rooms ════════════════════════════════════════════════════
     Nine plates in a grid rather than a rail across the top. The rail
     cost a whole row of height on every screen, permanently, to show
     you the eight rooms you were not in. -->
<aside id="picker" role="dialog" aria-modal="true" aria-labelledby="picker-h" hidden>
  <div class="picker__in">
    <p class="picker__kick" id="picker-h">Nine rooms</p>
    <div id="rooms-list"></div>
    <button id="picker-close" class="chip" type="button">Close</button>
  </div>
</aside>

<!-- ══ the index ════════════════════════════════════════════════════ -->
<aside id="list" aria-label="Track list" hidden>
  <div class="list__bar">
    <input id="q" type="search" placeholder="Search a song, a singer, a film…" aria-label="Search tracks" autocomplete="off">
    <button id="list-close" class="chip" type="button">Close</button>
  </div>
  <div class="ix__filters" id="filters" role="group" aria-label="Filters"></div>
  <p class="list__count" id="list-count"></p>
  <ol class="list__rows" id="rows"></ol>
  <p class="list__none" id="none" hidden>Nothing matches that. Clear a filter and try again.</p>
</aside>

<script src="assets/js/catalog.js"></script>
<script src="assets/js/rooms.js"></script>
<script src="assets/js/reels.js"></script>
<script src="assets/js/corridor.js"></script>
<script src="assets/js/made.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
